name: Task4 338 Authenticated Five GET Read Only (NO WRITE)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-readonly-preflight:
    if: github.repository == 'veritasfuji-japan/veritas-task4-cas-lab' && github.ref == 'refs/heads/main' && github.actor == 'veritasfuji-japan' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ""
      TASK4_OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_BASE_URL: ""
      VERITAS_DATABASE_URL: ""
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.16"
      - name: Verify checkout pin and run #338 offline negative tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python -m pip install --disable-pip-version-check "pytest==9.1.1"
          python -m pytest -q -o addopts= tests/test_task4_338_live_authenticated_readonly_preflight_v1.py \
            --junitxml=results/task4-338-junit.xml | tee results/task4-338-pytest.log
      - name: Exactly five authenticated GitHub GET (READ ONLY)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/task4_338_live_authenticated_readonly_preflight_v1.py results/task4-338-live-readonly-preflight.json \
            | tee results/task4-338-live-readonly-preflight.log
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path("results/task4-338-live-readonly-preflight.json")
          d=json.loads(p.read_text())
          h=d.pop("report_sha256")
          exact=hashlib.sha256(json.dumps(d,sort_keys=True,ensure_ascii=False,separators=(",",":"),allow_nan=False).encode()).hexdigest()
          assert h==exact
          assert d["real_github_create_ref_post_count"]==0
          assert d["real_provider_post_count"]==0
          assert d["future_writer_authorized"] is False
          assert d["provider_dispatch"]=="DENY"
          PY
          sha256sum scripts/task4_338_live_authenticated_readonly_preflight_v1.py tests/test_task4_338_live_authenticated_readonly_preflight_v1.py contracts/TASK4_338_LIVE_AUTHENTICATED_READONLY_PREFLIGHT_V1.json \
            results/task4-338-live-readonly-preflight.json > results/task4-338-file-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task4-338-live-authenticated-five-get-readonly
          path: results/*
          if-no-files-found: warn
